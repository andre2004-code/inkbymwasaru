<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ink by Mwasaru favicon">
  <rect width="512" height="512" fill="#050505"/>

  <!-- Tattoo machine body -->
  <g fill="none" stroke="#f3f3f3" stroke-linecap="round" stroke-linejoin="round">
    <!-- top cap -->
    <path d="M182 118l42-38h64l42 38-20 22h-108l-20-22z" stroke-width="12" fill="#f3f3f3"/>
    <path d="M202 116h108" stroke-width="10"/>

    <!-- front machine body -->
    <path d="M154 160h204c18 0 32 14 32 32v90c0 18-14 32-32 32H154c-18 0-32-14-32-32v-90c0-18 14-32 32-32z" stroke-width="12" fill="#f3f3f3"/>

    <!-- side detail lines -->
    <path d="M196 160v156M256 160v156M316 160v156" stroke-width="10"/>

    <!-- coil/rings -->
    <circle cx="184" cy="196" r="18" fill="#f3f3f3" stroke="none"/>
    <circle cx="296" cy="196" r="18" fill="#f3f3f3" stroke="none"/>
    <circle cx="184" cy="264" r="18" fill="#f3f3f3" stroke="none"/>
    <circle cx="296" cy="264" r="18" fill="#f3f3f3" stroke="none"/>

    <!-- needle housing -->
    <path d="M232 284h48v32h-48z" stroke-width="10" fill="#f3f3f3"/>
    <path d="M256 316v58" stroke-width="12"/>
    <path d="M236 374h40" stroke-width="12"/>

    <!-- lower machine top / bracket -->
    <path d="M165 170l-64 8 32 44 55-10-23-42z" stroke-width="10" fill="#f3f3f3"/>
    <path d="M347 170l64 8-32 44-55-10 23-42z" stroke-width="10" fill="#f3f3f3"/>

    <!-- machine rod -->
    <path d="M149 219l-118 66" stroke-width="12"/>
    <path d="M363 219l118 66" stroke-width="12"/>
  </g>

  <!-- Hand holding the tattoo gun -->
  <g fill="#f3f3f3" stroke="#f3f3f3" stroke-linecap="round" stroke-linejoin="round">
    <!-- palm -->
    <path d="M132 420c-24-18-52-29-78-31-16-2-29 8-29 21 0 19 19 33 46 43 22 8 52 11 77 5l50-12-66-26z" stroke-width="8"/>
    <path d="M119 351c-18 15-33 45-28 66 5 25 25 41 52 47 26 6 53-3 72-24l16-19-51-64-61-6z" stroke-width="8"/>

    <!-- fingers -->
    <path d="M186 355l38 70 26-7-20-78-44 15z" stroke-width="8"/>
    <path d="M232 340l34 86 25-8-18-86-41 8z" stroke-width="8"/>
    <path d="M271 332l28 74 25-7-15-75-38 8z" stroke-width="8"/>
    <path d="M305 331l20 58 22-11-8-56-34 9z" stroke-width="8"/>

    <!-- thumb -->
    <path d="M118 421l32 88 52-22-35-81-49 15z" stroke-width="8"/>
  </g>

  <!-- End of needle / tip -->
  <g fill="none" stroke="#f3f3f3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 382v82" stroke-width="10"/>
    <path d="M244 456l12 18 12-18" stroke-width="10"/>
  </g>

  <!-- Small circular accents for detail -->
  <g fill="#f3f3f3" stroke="none">
    <circle cx="120" cy="213" r="9"/>
    <circle cx="392" cy="213" r="9"/>
    <circle cx="166" cy="172" r="8"/>
    <circle cx="346" cy="172" r="8"/>
  </g>
</svg>
